# Builds the HazardWatch Android app (android/) and publishes HazardWatch.apk
# unsigned on the "android-latest" release. The installable HazardWatch.apk is signed separately with the fixed app key.
name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - run: gradle assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release-unsigned.apk HazardWatch-unsigned.apk

      - name: Publish on the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest HazardWatch-unsigned.apk \
            --target "${{ github.sha }}" \
            --title "HazardWatch Android app" \
            --notes "Unsigned build: it cannot be installed as is. The installable HazardWatch.apk is signed with the fixed app key (fingerprint in android/assetlinks.json) and shared separately."
