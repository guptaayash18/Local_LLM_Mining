# Builds the HazardWatch Android app (android/) and publishes HazardWatch.apk
# on the "android-latest" release, so it can be downloaded on a phone.
name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key for this build
        run: |
          PW=$(openssl rand -hex 16)
          echo "::add-mask::$PW"
          echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: >
          keytool -genkeypair -keystore "$KEYSTORE_PATH" -storetype JKS
          -alias hazardwatch -keyalg RSA -keysize 2048 -validity 10000
          -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD"
          -dname "CN=HazardWatch, O=Yash Gupta, C=IN"

      - run: gradle assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk HazardWatch.apk

      - name: Publish on the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest HazardWatch.apk \
            --target "${{ github.sha }}" \
            --title "HazardWatch Android app" \
            --notes "Download HazardWatch.apk on the phone, open it and tap Install. Opens https://guptaayash18.github.io/Local_LLM_Mining/ full-screen in Chrome."
