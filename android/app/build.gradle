// Android app for HazardWatch: a Trusted Web Activity that opens the GitHub Pages
// edition full-screen in Chrome, so the in-phone AI model can use the GPU (WebGPU).
plugins {
    id "com.android.application"
}

android {
    namespace "io.github.guptaayash18.hazardwatch"
    compileSdk 34

    defaultConfig {
        applicationId "io.github.guptaayash18.hazardwatch"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Built unsigned; signed afterwards with the fixed HazardWatch key, whose
    // fingerprint is published in https://guptaayash18.github.io/.well-known/assetlinks.json
    // so Android opens the app without an address bar.
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
