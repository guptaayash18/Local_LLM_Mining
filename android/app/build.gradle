// Android app for HazardWatch: a Trusted Web Activity that opens the GitHub Pages
// edition full-screen in Chrome, so the in-phone AI model can use the GPU (WebGPU).
plugins {
    id "com.android.application"
}

android {
    namespace "io.github.guptaayash18.hazardwatch"
    compileSdk 34

    defaultConfig {
        applicationId "io.github.guptaayash18.hazardwatch"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            // shortcut: the CI build makes a fresh key each run, so an update needs the old app uninstalled first; store a fixed key as a repo secret to allow in-place updates.
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias "hazardwatch"
            keyPassword System.getenv("KEYSTORE_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
